name: iPhone stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test_sms:
        description: "Just send a test text message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check Apple stock
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          MY_MOBILE: ${{ secrets.MY_MOBILE }}
          TEST_SMS: ${{ inputs.test_sms }}
        run: python check_stock.py

      - name: Remember what was in stock
        run: |
          if [ -f state.json ]; then
            git config user.name "stock-checker"
            git config user.email "stock-checker@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "Update stock state" && git push)
          fi
