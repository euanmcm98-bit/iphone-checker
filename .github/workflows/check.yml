name: iPhone stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Just send a test notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check Apple stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: python check_stock.py

      - name: Remember what was in stock
        run: |
          if [ -f state.json ]; then
            git config user.name "stock-checker"
            git config user.email "stock-checker@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "Update stock state" && git push)
          fi
